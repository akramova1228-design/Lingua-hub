<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LinguaHub</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f2f4fb;--ink:#1a1d3a;--mut:#5d6385;--card:#fff;--line:#d9dcf0;--acc:#5a49d6;--acc2:#e8467c;--ok:#1f8f4e;--bad:#c23b2a}
@media (prefers-color-scheme:dark){:root{--bg:#12142b;--ink:#e9eaf8;--mut:#a3a8cf;--card:#1c1f3d;--line:#323761;--acc:#8e80ff;--acc2:#ff7aa5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 70px}
h1,h2,h3{margin:0 0 8px}h1{font-size:1.9rem;font-weight:800}h2{font-size:1.25rem}h3{font-size:1.02rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:.9rem}
button,input,textarea,select{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;margin-top:6px}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.del{background:var(--bad);padding:4px 10px;font-size:.8rem;margin:0}
input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
input[type=file]{margin:6px 0;max-width:100%}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
nav button{white-space:nowrap;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600}
nav button[aria-current=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.task,.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.task{justify-content:flex-start;align-items:flex-start}
.task input{width:20px;height:20px;margin-top:3px;accent-color:var(--acc)}
.task input:checked+span{text-decoration:line-through;color:var(--mut)}
.tag{font-size:.75rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-left:6px}
.opt{display:flex;gap:8px;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.passage{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;margin:8px 0}
video,iframe,audio{width:100%;border-radius:10px;margin-top:8px}
iframe{aspect-ratio:16/9;border:0}
.err{color:var(--bad);font-size:.9rem}.okm{color:var(--ok);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const SB_URL="https://wmnzkiedaemrwsuqjolg.supabase.co";
const SB_KEY="sb_publishable_Thj7qxNEnQzSFKq8EJiHlg_0Y_NCUeu";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SK=["Listening","Reading","Writing","Speaking","Grammar","Vocabulary"];
const skOpts=SK.map(s=>`<option>${s}</option>`).join("");
const today=()=>new Date().toLocaleDateString("en-CA");
let me=null,prof=null,tab="home";

function authView(){
 let reg=true;
 $("#app").innerHTML=`<h1>LinguaHub</h1><p class="mut">Til o'rganish platformasi</p>
 <div class="card"><h2 id="at">Ro'yxatdan o'tish</h2>
 <input type="text" id="nm" placeholder="Ismingiz" autocomplete="name">
 <input type="email" id="em" placeholder="Email" autocomplete="email">
 <input type="password" id="pw" placeholder="Parol (kamida 6 belgi)" autocomplete="current-password">
 <p id="er" class="err"></p>
 <button class="btn" id="go">Ro'yxatdan o'tish</button> <button class="btn alt" id="sw">Kirish</button></div>`;
 $("#sw").onclick=()=>{reg=!reg;$("#at").textContent=reg?"Ro'yxatdan o'tish":"Kirish";$("#go").textContent=reg?"Ro'yxatdan o'tish":"Kirish";$("#sw").textContent=reg?"Kirish":"Ro'yxatdan o'tish";$("#nm").style.display=reg?"":"none"};
 $("#go").onclick=async()=>{
  const email=$("#em").value.trim(),password=$("#pw").value,full_name=$("#nm").value.trim();
  $("#er").textContent="";
  if(!email||!password||(reg&&!full_name)){$("#er").textContent="Barcha maydonlarni to'ldiring.";return}
  const r=reg?await sb.auth.signUp({email,password,options:{data:{full_name}}}):await sb.auth.signInWithPassword({email,password});
  if(r.error){$("#er").textContent=r.error.message;return}
  if(!r.data.session){$("#er").textContent="Emailingizga tasdiqlash xati yuborildi. Havolani bosing, so'ng kiring.";return}
  boot(r.data.session.user);
 };
}
async function boot(u){
 me=u;
 const {data}=await sb.from("profiles").select("*").eq("id",u.id).single();
 prof=data||{role:"student",full_name:""};
 shell();
}
function shell(){
 const T=[["home","Bosh sahifa"],["tests","Testlar"],["videos","Videolar"],["prog","Progress"]];
 if(prof.role==="teacher")T.push(["teacher","Ustoz paneli"]);
 $("#app").innerHTML=`<div class="top"><h2>Salom, ${esc(prof.full_name||me.email)}</h2><button class="btn alt" id="lo">Chiqish</button></div>
 <nav>${T.map(t=>`<button data-t="${t[0]}" aria-current="${t[0]===tab}">${t[1]}</button>`).join("")}</nav><div id="view">Yuklanmoqda...</div>`;
 $("#lo").onclick=async()=>{await sb.auth.signOut();me=null;authView()};
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});
 ({home,tests,videos,prog,teacher})[tab]();
}
async function home(){
 const [a,b]=await Promise.all([sb.from("tasks").select("*").eq("due_date",today()),sb.from("task_done").select("task_id").eq("user_id",me.id)]);
 const done=new Set((b.data||[]).map(x=>x.task_id)),ts=a.data||[];
 $("#view").innerHTML=`<div class="card"><h2>Bugungi vazifalar</h2>${ts.length?ts.map(t=>`<label class="task"><input type="checkbox" data-id="${t.id}" ${done.has(t.id)?"checked":""}><span>${esc(t.title)}<span class="tag">${esc(t.skill)}</span></span></label>`).join(""):'<p class="mut">Bugun uchun vazifa yo\'q.</p>'}</div>`;
 document.querySelectorAll(".task input").forEach(c=>c.onchange=async()=>{
  const id=+c.dataset.id;
  if(c.checked)await sb.from("task_done").insert({user_id:me.id,task_id:id});
  else await sb.from("task_done").delete().eq("user_id",me.id).eq("task_id",id);
 });
}
async function tests(){
 const {data}=await sb.from("tests").select("id,title,skill").order("id",{ascending:false});
 $("#view").innerHTML=`<div class="card"><h2>Testlar</h2>${(data||[]).map(t=>`<div class="item"><span>${esc(t.title)}<span class="tag">${esc(t.skill)}</span></span><button class="btn" data-id="${t.id}">Boshlash</button></div>`).join("")||'<p class="mut">Hozircha test yo\'q.</p>'}</div>`;
 document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openTest(+b.dataset.id));
}
async function openTest(id){
 const [t,q]=await Promise.all([sb.from("tests").select("*").eq("id",id).single(),sb.from("questions").select("*").eq("test_id",id).order("id")]);
 const T=t.data,Q=q.data||[];
 $("#view").innerHTML=`<div class="card"><button class="btn alt" id="bk">Orqaga</button><h2 style="margin-top:10px">${esc(T.title)}</h2>
 ${T.audio_url?`<audio controls src="${esc(T.audio_url)}"></audio>`:""}${T.passage?`<div class="passage">${esc(T.passage)}</div>`:""}
 ${Q.map((x,i)=>`<div data-q="${x.id}"><p><b>${i+1}. ${esc(x.body)}</b></p>${x.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${x.id}" value="${j}"> ${esc(o)}</label>`).join("")}</div>`).join("")}
 <button class="btn" id="ck">Tekshirish</button><p id="rs"></p></div>`;
 $("#bk").onclick=tests;
 $("#ck").onclick=async()=>{
  let sc=0;
  Q.forEach(x=>{
   const pick=document.querySelector(`input[name=q${x.id}]:checked`);
   const opts=document.querySelectorAll(`[data-q="${x.id}"] .opt`);
   opts[x.answer].classList.add("ok");
   if(pick&&+pick.value===x.answer)sc++;else if(pick)opts[+pick.value].classList.add("bad");
  });
  $("#ck").disabled=true;
  $("#rs").innerHTML=`<b>Natija: ${sc} / ${Q.length}</b>`;
  await sb.from("attempts").insert({user_id:me.id,test_id:id,score:sc,total:Q.length});
 };
}
function embed(u){
 const m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
 return m?`<iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe>`:`<video controls src="${esc(u)}"></video>`;
}
async function videos(){
 const {data}=await sb.from("videos").select("*").order("id",{ascending:false});
 $("#view").innerHTML=(data||[]).map(v=>`<div class="card"><h3>${esc(v.title)}<span class="tag">${esc(v.skill||"")}</span></h3>${embed(v.url)}</div>`).join("")||'<div class="card"><p class="mut">Hozircha video yo\'q.</p></div>';
}
async function prog(){
 const [a,b]=await Promise.all([sb.from("attempts").select("score,total,created_at,tests(title)").eq("user_id",me.id).order("created_at",{ascending:false}),sb.from("task_done").select("task_id",{count:"exact",head:true}).eq("user_id",me.id)]);
 const A=a.data||[],pc=A.length?Math.round(A.reduce((s,x)=>s+x.score/Math.max(1,x.total),0)/A.length*100):0;
 $("#view").innerHTML=`<div class="card"><h2>Progress</h2><p>Bajarilgan vazifalar: <b>${b.count||0}</b></p><p>Topshirilgan testlar: <b>${A.length}</b></p><p>O'rtacha natija: <b>${pc}%</b></p></div>
 <div class="card"><h3>Test natijalari</h3>${A.map(x=>`<div class="item"><span>${esc(x.tests?.title||"Test")}</span><b>${x.score}/${x.total}</b></div>`).join("")||'<p class="mut">Hali test topshirilmagan.</p>'}</div>`;
}
async function upload(bucket,file){
 const p=Date.now()+"-"+file.name.replace(/[^\w.-]/g,"_");
 const {error}=await sb.storage.from(bucket).upload(p,file);
 if(error)throw error;
 return sb.storage.from(bucket).getPublicUrl(p).data.publicUrl;
}
function say(id,txt,ok){const e=$(id);e.className=ok?"okm":"err";e.textContent=txt}
async function teacher(){
 $("#view").innerHTML=`
 <div class="card"><h2>Kunlik vazifa qo'shish</h2><input type="text" id="tt" placeholder="Vazifa matni"><select id="ts">${skOpts}</select><input type="date" id="td" value="${today()}"><button class="btn" id="tb">Saqlash</button><p id="tm"></p></div>
 <div class="card"><h2>Video qo'shish</h2><input type="text" id="vt" placeholder="Video nomi"><select id="vs">${skOpts}</select><input type="text" id="vu" placeholder="YouTube havolasi (yoki quyida fayl tanlang)"><input type="file" id="vf" accept="video/*"><button class="btn" id="vb">Saqlash</button><p id="vm"></p></div>
 <div class="card"><h2>Test qo'shish</h2><input type="text" id="et" placeholder="Test nomi"><select id="es">${skOpts}</select>
 <textarea id="ep" rows="5" placeholder="Reading uchun passage matni (listening bo'lsa bo'sh qoldiring)"></textarea>
 <p class="mut">Listening uchun audio fayl:</p><input type="file" id="ef" accept="audio/*">
 <textarea id="eq" rows="6" placeholder="Har qator bitta savol:&#10;Savol matni | A variant | B variant | C variant | to'g'ri variant raqami (1 dan)&#10;Masalan: Tashkent nima? | Qishloq | Poytaxt | Daryo | 2"></textarea>
 <button class="btn" id="eb">Saqlash</button><p id="em2"></p></div>
 <div class="card"><h2>Mavjud kontent</h2><div id="ls">Yuklanmoqda...</div></div>`;
 $("#tb").onclick=async()=>{
  const title=$("#tt").value.trim();if(!title)return say("#tm","Vazifa matnini yozing.");
  const {error}=await sb.from("tasks").insert({title,skill:$("#ts").value,due_date:$("#td").value});
  if(error)return say("#tm",error.message);say("#tm","Saqlandi.",1);$("#tt").value="";list();
 };
 $("#vb").onclick=async()=>{
  const title=$("#vt").value.trim();let url=$("#vu").value.trim();const f=$("#vf").files[0];
  if(!title||(!url&&!f))return say("#vm","Nom va havola yoki fayl kerak.");
  try{say("#vm","Yuklanmoqda...",1);if(f)url=await upload("videos",f);
   const {error}=await sb.from("videos").insert({title,skill:$("#vs").value,url});if(error)throw error;
   say("#vm","Saqlandi.",1);list();}catch(e){say("#vm",e.message)}
 };
 $("#eb").onclick=async()=>{
  const title=$("#et").value.trim(),passage=$("#ep").value.trim(),f=$("#ef").files[0];
  const qs=$("#eq").value.split("\n").map(l=>l.split("|").map(s=>s.trim())).filter(p=>p.length>=4).map(p=>{
   const ans=parseInt(p[p.length-1],10)-1,opts=p.slice(1,-1);return{body:p[0],options:opts,answer:ans}}).filter(q=>q.body&&q.options.length>=2&&q.answer>=0&&q.answer<q.options.length);
  if(!title||!qs.length)return say("#em2","Nom va kamida bitta to'g'ri formatdagi savol kerak.");
  try{say("#em2","Saqlanmoqda...",1);const audio_url=f?await upload("audio",f):null;
   const t=await sb.from("tests").insert({title,skill:$("#es").value,passage:passage||null,audio_url}).select().single();if(t.error)throw t.error;
   const r=await sb.from("questions").insert(qs.map(q=>({...q,test_id:t.data.id})));if(r.error)throw r.error;
   say("#em2",`Saqlandi: ${qs.length} ta savol.`,1);list();}catch(e){say("#em2",e.message)}
 };
 list();
}
async function list(){
 const [a,b,c]=await Promise.all([sb.from("tasks").select("id,title,due_date").order("id",{ascending:false}).limit(15),sb.from("videos").select("id,title").order("id",{ascending:false}),sb.from("tests").select("id,title").order("id",{ascending:false})]);
 const row=(t,x,l)=>`<div class="item"><span>${esc(l)}</span><button class="btn del" data-t="${t}" data-id="${x}">O'chirish</button></div>`;
 $("#ls").innerHTML=`<h3>Vazifalar</h3>${(a.data||[]).map(x=>row("tasks",x.id,x.due_date+" · "+x.title)).join("")||'<p class="mut">Yo\'q</p>'}
 <h3 style="margin-top:12px">Videolar</h3>${(b.data||[]).map(x=>row("videos",x.id,x.title)).join("")||'<p class="mut">Yo\'q</p>'}
 <h3 style="margin-top:12px">Testlar</h3>${(c.data||[]).map(x=>row("tests",x.id,x.title)).join("")||'<p class="mut">Yo\'q</p>'}`;
 document.querySelectorAll(".del").forEach(d=>d.onclick=async()=>{
  if(!confirm("O'chirilsinmi?"))return;
  await sb.from(d.dataset.t).delete().eq("id",+d.dataset.id);list();
 });
}
sb.auth.getSession().then(({data})=>data.session?boot(data.session.user):authView());
</script>
</body>
</html>
